<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <title>
        Join Game Room
    </title>

    <style>

        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            height: 180px;
            margin-top: 10px;
            font-family: monospace;
        }

        #status {
            margin: 20px 0;
            font-weight: bold;
        }

        #game {
            width: 600px;
            height: 400px;
            border: 2px solid black;
            position: relative;
            margin-top: 20px;
        }

        .player {
            position: absolute;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: black;
            transform: translate(-50%, -50%);
        }

    </style>
</head>

<body>

<h1>
    Game Room
</h1>


<div id="status">
    Подготовка...
</div>


<button id="connectButton">
    Connect
</button>


<div id="answerContainer" style="display:none">

    <h3>
        Отправь эту ссылку хосту
    </h3>

    <textarea
        id="answerLink"
        readonly
    ></textarea>

</div>


<h2>
    Player
</h2>

<div>
    ID:
    <strong id="playerId">
        -
    </strong>
</div>


<h2>
    Game
</h2>

<div id="game"></div>


<h2>
    Chat
</h2>

<div id="messages"></div>


<input
    id="chatInput"
    placeholder="Сообщение..."
>

<button id="chatButton">
    Send
</button>


<script src="client.js"></script>

</body>

</html>
