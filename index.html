<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Browser Game Server</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<main class="container">

    <h1>Browser Game</h1>


    <!-- ============================= -->
    <!-- LOBBY -->
    <!-- ============================= -->

    <section id="lobby">

        <div id="lobbyMenu">

            <h2>Лобби</h2>

            <input
                id="playerName"
                type="text"
                maxlength="24"
                placeholder="Имя игрока"
                value="Player"
            >

            <div class="buttons">

                <button id="hostButton">
                    Создать комнату
                </button>

                <button id="joinButton">
                    Подключиться
                </button>

            </div>

        </div>


        <!-- HOST -->

        <div id="hostLobby" class="hidden">

            <h2>Комната</h2>

            <div class="roomCode">
                <span>Код комнаты:</span>

                <strong id="roomCode">
                    -
                </strong>
            </div>


            <h3>Приглашение</h3>

            <textarea
                id="hostOffer"
                readonly
                placeholder="Здесь появится ссылка приглашения"
            ></textarea>


            <h3>Ответ игрока</h3>

            <textarea
                id="hostAnswer"
                placeholder="Вставь сюда ответ игрока"
            ></textarea>


            <button id="acceptAnswerButton">
                Подключить игрока
            </button>


            <h3>Игроки</h3>

            <div id="hostPlayers"></div>


            <p id="hostStatus"></p>

        </div>


        <!-- CLIENT -->

        <div id="clientLobby" class="hidden">

            <h2>Подключение</h2>

            <p id="clientStatus">
                Подготовка...
            </p>


            <button id="createAnswerButton">
                Создать ответ
            </button>


            <textarea
                id="clientAnswer"
                readonly
                placeholder="Здесь появится ответ для хоста"
            ></textarea>

        </div>

    </section>


    <!-- ============================= -->
    <!-- GAME -->
    <!-- ============================= -->

    <section id="gameSection" class="hidden">

        <div class="gameHeader">

            <div>
                Комната:
                <strong id="gameRoomCode">-</strong>
            </div>

            <div>
                Игрок:
                <strong id="gamePlayerId">-</strong>
            </div>

        </div>


        <div id="gameWorld"></div>


        <p>
            WASD / стрелки — движение
        </p>


        <h3>Чат</h3>

        <div id="chat"></div>


        <div class="chatInput">

            <input
                id="chatMessage"
                type="text"
                maxlength="500"
                placeholder="Сообщение"
            >

            <button id="sendChatButton">
                Отправить
            </button>

        </div>

    </section>

</main>


<script type="module" src="./js/main.js"></script>

</body>

</html>
